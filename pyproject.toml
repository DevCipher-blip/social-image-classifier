[project]
name = "social-image-classifier"
version = "0.2.0"
description = "Flask API that labels images from uploads or a Twitter profile with a pretrained VGG19"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
